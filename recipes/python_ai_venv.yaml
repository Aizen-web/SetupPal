id: python_ai_venv
name: Isolated Python AI & Data Science Environment
triggers:
  - "python ai"
  - "python data science"
  - "data science setup"
  - "set me up for python data science"
  - "pytorch jupyter"
summary: "Installs Python 3.12 via winget, creates an isolated venv in %USERPROFILE%\\.venvs\\python-ai, and installs pinned NumPy, Pandas, and Colorama from PyPI into it."
steps:
  - id: step-0
    description: "Install Python 3.12 via winget"
    step:
      action: install_package
      params:
        ecosystem: winget
        package_id: Python.Python.3.12
        source_adapter: winget
  - id: step-1
    description: 'Create isolated Python virtual environment in %USERPROFILE%\.venvs\python-ai'
    step:
      action: create_isolated_env
      params:
        kind: python_venv
        path: "%USERPROFILE%\\.venvs\\python-ai"
  - id: step-2
    description: "Install numpy inside isolated environment"
    step:
      action: install_package
      params:
        ecosystem: py_p_i
        package_id: numpy
        version: "2.1.1"
        source_adapter: py_p_i
  - id: step-3
    description: "Install pandas inside isolated environment"
    step:
      action: install_package
      params:
        ecosystem: py_p_i
        package_id: pandas
        version: "2.2.3"
        source_adapter: py_p_i
  - id: step-4
    description: "Install colorama inside isolated environment"
    step:
      action: install_package
      params:
        ecosystem: py_p_i
        package_id: colorama
        version: "0.4.6"
        source_adapter: py_p_i
  - id: step-5
    description: "Verify Python package imports"
    step:
      action: run_verify_command
      params:
        binary: python
        args:
          - "-c"
          - "import numpy, pandas, colorama"
