id: obs_studio
name: OBS Studio for Recording and Streaming
triggers:
  - "obs studio"
  - "screen recording"
  - "streaming software"
summary: "Installs OBS Studio via winget and checks that it is registered."
steps:
  - id: step-1
    description: "Install OBS Studio via winget"
    step:
      action: install_package
      params:
        ecosystem: winget
        package_id: OBSProject.OBSStudio
        source_adapter: winget
