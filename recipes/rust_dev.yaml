id: rust_dev
name: Rust Systems Programming Toolchain (Rustup, Cargo, Rustc, Git)
triggers:
  - "rust setup"
  - "rust development"
  - "rust toolchain"
  - "set me up for rust"
  - "rustup and cargo"
summary: "Installs rustup and Git via winget, then checks that rustc and cargo respond on the command line."
steps:
  - id: step-1
    description: "Install Rustup toolchain installer via Winget"
    step:
      action: install_package
      params:
        ecosystem: winget
        package_id: Rustlang.Rustup
        source_adapter: winget
  - id: step-2
    description: "Install Git version control system via Winget"
    step:
      action: install_package
      params:
        ecosystem: winget
        package_id: Git.Git
        source_adapter: winget
  - id: step-3
    description: "Verify rustc --version responds cleanly"
    step:
      action: run_verify_command
      params:
        binary: rustc
        args:
          - "--version"
  - id: step-4
    description: "Verify cargo --version responds cleanly"
    step:
      action: run_verify_command
      params:
        binary: cargo
        args:
          - "--version"

