id: cpp20_dev
name: Modern C++20 Development Environment (LLVM Clang, CMake, Ninja, Git)
triggers:
  - "c++20"
  - "c++ dev"
  - "cpp20"
  - "c++ toolchain"
  - "c++ development"
summary: "Installs LLVM Clang, CMake, Ninja, and Git via winget, adds Clang's folder to your User PATH, and verifies that a C++20 program compiles and runs."
steps:
  - id: step-1
    description: "Install the LLVM Clang toolchain via winget"
    step:
      action: install_package
      params:
        ecosystem: winget
        package_id: LLVM.LLVM
        source_adapter: winget
  - id: step-2
    description: "Install the CMake build system via winget"
    step:
      action: install_package
      params:
        ecosystem: winget
        package_id: Kitware.CMake
        source_adapter: winget
  - id: step-3
    description: "Install the Ninja build tool via winget"
    step:
      action: install_package
      params:
        ecosystem: winget
        package_id: Ninja-build.Ninja
        source_adapter: winget
  - id: step-4
    description: "Install Git via winget"
    step:
      action: install_package
      params:
        ecosystem: winget
        package_id: Git.Git
        source_adapter: winget
  - id: step-5
    description: "Find clang++ and add its folder to the User PATH"
    step:
      action: add_discovered_tool_to_path
      params:
        binary: clang
  - id: step-6
    description: "Verify clang++ --version responds"
    step:
      action: run_verify_command
      params:
        binary: clang
        args:
          - "--version"
  - id: step-7
    description: "Verify cmake --version responds"
    step:
      action: run_verify_command
      params:
        binary: cmake
        args:
          - "--version"
  - id: step-8
    description: "Verify ninja --version responds"
    step:
      action: run_verify_command
      params:
        binary: ninja
        args:
          - "--version"
