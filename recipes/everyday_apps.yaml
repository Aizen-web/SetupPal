id: everyday_apps
name: Everyday Apps (7-Zip and VLC)
triggers:
  - "everyday apps"
  - "7-zip, vlc"
  - "7-zip and vlc"
  - "vlc and 7-zip"
summary: "Installs 7-Zip and VLC media player via winget and checks that each one is registered."
steps:
  - id: step-1
    description: "Install 7-Zip via winget"
    step:
      action: install_package
      params:
        ecosystem: winget
        package_id: 7zip.7zip
        source_adapter: winget
  - id: step-2
    description: "Install VLC media player via winget"
    step:
      action: install_package
      params:
        ecosystem: winget
        package_id: VideoLAN.VLC
        source_adapter: winget
