id: minecraft_fabric_1_21
name: Modded Minecraft Java 1.21.1 with Fabric (Sodium, Lithium, FerriteCore)
triggers:
  - "modded minecraft"
  - "minecraft fabric"
  - "fabric for minecraft"
  - "modrinth fabric"
  - "minecraft java mods"
summary: "Installs the Eclipse Temurin Java 21 runtime, adds the Fabric loader for Minecraft Java 1.21.1, and downloads checksum-verified Sodium, Lithium, and FerriteCore from Modrinth into your mods folder. Minecraft Java Edition must already be installed and launched once."
steps:
  - id: step-1
    description: "Install Eclipse Temurin JDK 21 via winget"
    step:
      action: install_package
      params:
        ecosystem: winget
        package_id: EclipseAdoptium.Temurin.21.JDK
        source_adapter: winget
  - id: step-2
    description: "Verify the Java 21 runtime responds"
    step:
      action: run_verify_command
      params:
        binary: java
        args:
          - "-version"
  - id: step-3
    description: "Download the Fabric installer 1.1.2 from maven.fabricmc.net"
    step:
      action: download_artifact
      params:
        adapter: official_vendor_url
        id: fabric-installer
        version: "1.1.2"
        destination: "%LOCALAPPDATA%\\SetupPal\\downloads\\fabric-installer-1.1.2.jar"
        expected_sha256: "61e035bf7bf70153e127440ce34de47c9036f0a2d0c65d1529454bd35ceefe4f"
  - id: step-4
    description: "Install the Fabric loader for Minecraft 1.21.1"
    step:
      action: run_vendor_installer
      params:
        installer: fabric_client
        mc_version: "1.21.1"
        installer_path: "%LOCALAPPDATA%\\SetupPal\\downloads\\fabric-installer-1.1.2.jar"
  - id: step-5
    description: "Download Sodium 0.6.13 for Minecraft 1.21.1 from Modrinth"
    step:
      action: download_artifact
      params:
        adapter: modrinth
        id: sodium
        version: "mc1.21.1-0.6.13-fabric"
        destination: "%APPDATA%\\.minecraft\\mods\\sodium-fabric-0.6.13+mc1.21.1.jar"
        expected_sha256: "e04599514d88e41765f710eeba59e3814909833396bc11b977f48fc2e7e50353"
  - id: step-6
    description: "Download Lithium 0.15.2 for Minecraft 1.21.1 from Modrinth"
    step:
      action: download_artifact
      params:
        adapter: modrinth
        id: lithium
        version: "mc1.21.1-0.15.2-fabric"
        destination: "%APPDATA%\\.minecraft\\mods\\lithium-fabric-0.15.2+mc1.21.1.jar"
        expected_sha256: "537bc45224e81dd1cbae25c1a972f14dac2456f0f8725ced3ca88ae41d0156d3"
  - id: step-7
    description: "Download FerriteCore 7.0.0 for Minecraft 1.21 from Modrinth"
    step:
      action: download_artifact
      params:
        adapter: modrinth
        id: ferrite-core
        version: "7.0.0-fabric"
        destination: "%APPDATA%\\.minecraft\\mods\\ferritecore-7.0.0-fabric.jar"
        expected_sha256: "2c31200d1f5de6a3cf5edc4c3d39200636e1e060c4b548dcf8249ef487660323"
