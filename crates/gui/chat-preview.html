<!DOCTYPE html>
<html lang="en" data-mode="chill">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SetupPal: chat output preview (dev only)</title>
    <style>
      html, body { overflow: auto !important; height: auto !important; min-height: 100%; }
      body { margin: 0; background: var(--bg-canvas); color: var(--ink); font-family: var(--font-ui); transition: background-color 0.3s ease; }
      .pv-bar { position: sticky; top: 0; z-index: 5; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px 24px; background: var(--bg-sidebar); border-bottom: 1px solid var(--border); }
      .pv-bar button { height: 32px; padding: 0 12px; border: 1px solid var(--border); border-radius: 999px; background: var(--bg-surface); color: var(--ink); font: 600 13px var(--font-ui); cursor: pointer; }
      .pv-bar button.on { background: var(--btn-primary); color: var(--btn-primary-text); border-color: var(--btn-primary); }
      .pv-sep { width: 1px; height: 20px; background: var(--border); margin: 0 4px; }
      .pv-stage { padding: 24px; }
      .pv-width { margin: 0 auto; }
    </style>
  </head>
  <body>
    <div class="pv-bar" id="pv-bar"></div>
    <div class="pv-stage">
      <div class="pv-width" id="pv-width">
        <div class="chat-thread-stream" id="pv-thread"></div>
      </div>
    </div>
    <script type="module" src="/src/dev/chat-preview.js"></script>
  </body>
</html>
